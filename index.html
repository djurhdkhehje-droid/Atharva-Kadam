<div class="letter">
<h2>For You ✨</h2>
<div id="typed"></div>
</div>

<button class="yes" onclick="celebrate()">Yes, I Will 💍</button>
<div id="success">💖 You Made My Day! 💖</div>
</div>

<audio id="bgm" loop>
</audio>

<script>
for(let i=0;i<220;i++){
 let h=document.createElement('div');
 h.className='heart';h.innerHTML='❤️';
 h.style.left=Math.random()*100+'vw';
 h.style.fontSize=(10+Math.random()*30)+'px';
 h.style.animationDuration=(4+Math.random()*10)+'s';
 document.body.appendChild(h);
}

const text="Every smile of yours makes the world brighter. Every moment feels more beautiful when you are in it. Today I just want to say that you are truly special to me. ❤️";
let i=0;
function startExperience(){
 document.getElementById('intro').style.display='none';
 const t=document.getElementById('typed');
 const timer=setInterval(()=>{
   t.innerHTML+=text[i++]||'';
   if(i>=text.length) clearInterval(timer);
 },40);
}

const c=document.getElementById('fw'),ctx=c.getContext('2d');
function rs(){c.width=innerWidth;c.height=innerHeight} rs(); onresize=rs;
let p=[];
function burst(x,y){
 for(let i=0;i<120;i++){
   let a=Math.random()*Math.PI*2,s=Math.random()*7+2;
   p.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:100});
 }
}
function loop(){
 ctx.clearRect(0,0,c.width,c.height);
 p.forEach(o=>{o.x+=o.vx;o.y+=o.vy;o.vy+=0.04;o.l--;
 ctx.beginPath();ctx.arc(o.x,o.y,3,0,6.28);ctx.fill();});
 p=p.filter(o=>o.l>0);
 requestAnimationFrame(loop);
}
loop();

function celebrate(){
 document.getElementById('success').style.display='block';
 for(let k=0;k<16;k++) setTimeout(()=>burst(Math.random()*innerWidth,Math.random()*innerHeight*0.7),k*220);
}
</script>
